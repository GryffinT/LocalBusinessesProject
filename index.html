<!DOCTYPE html>
<html lang="en" style="background-color: rgb(219, 219, 219); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; min-height: 100vh;">
<head>
    <meta charset="utf-8">
    <title>Local Business App</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            min-width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .card-container {
            background-color: white;
            border-radius: 3%;
            box-sizing: border-box;
            width: 70vw;
            max-width: 700px;
            height: 75vh;
            min-height: 400px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            /* ensures children never leave the card */
            box-shadow: 0 2px 24px rgba(0,0,0,0.10);
        }
        .card-header {
            width: 100%;
            text-align: center;
        }
        .card-divider {
            height: 2px;
            width: 60%;
            background-color: black;
            border: none;
            margin: 0 auto;
        }
        .card-form {
            flex: 1 0 auto;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        .card-form input[type="password"],
        .card-form input[type="text"] {
            width: 88%;
            max-width: 340px;
            margin-bottom: 10px;
            border: 2px solid rgb(60,179,113);
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 1.02em;
            box-sizing: border-box;
            background: #fafafa;
        }
        .card-form label {
            align-self: flex-start;
            margin-left: 6%;
            font-size: 0.98em;
            color: #333;
        }
        .card-form button {
            margin-top: 22px;
            min-width: 100px;
            padding: 6px 16px;
            border-radius: 6px;
            border: none;
            background: rgb(60,179,113);
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
        }
        .card-form button:hover {
            background: rgb(50,150,90);
        }
        #location {
            font-weight: bold;
            color: #19795a;
        }
        /* Responsive */
        @media (max-width: 600px) {
            .card-container {
                width: 95vw;
                min-width: unset;
                height: 92vh;
                min-height: 280px;
                border-radius: 4vw;
            }
            .card-header {
                font-size: 1.25em;
            }
            .card-form input[type="password"],
            .card-form input[type="text"] {
                width: 98%;
            }
        }

        /* Docked icons at the bottom */
        .docked-bar {
            background-color: white;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.12);
            display: grid;
            grid-template-columns: repeat(4, 2rem);
            position: fixed;
            left: 50%;
            bottom: 2%;
            transform: translateX(-50%);
            padding: 0.25rem 1.1rem;
            border-radius: 1.25rem;
            z-index: 10;
            gap: 1.2rem;
        }
        .dockedImage {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card-header">
            <h1>Login</h1>
            <hr class="card-divider">
            <h3>Location Status: <span id="location"></span></h3>
        </div>
        <form class="card-form" autocomplete="off" onsubmit="return false;">
            <input id="password" type="password" name="password" placeholder="Password" required>
            <label for="password">Password</label>
            <input id="username" type="text" name="username" placeholder="Username" required>
            <label for="username">Username</label>
            <button type="submit">Login/Signup</button>
        </form>
    </div>
    <div class="docked-bar">
        <img src="https://i.postimg.cc/wTgd3Ywp/icons8-menu-rounded-50.png" class="dockedImage" alt="Menu">
        <img src="https://i.postimg.cc/QtZVxCxw/icons8-search-in-list-50.png" class="dockedImage" alt="Search">
        <img src="https://i.postimg.cc/SxyxP31Z/icons8-home-page-50.png" class="dockedImage" alt="Home">
        <img src="https://i.postimg.cc/bNPyG4Pb/icons8-gear-50.png" class="dockedImage" alt="Settings">
    </div>
    <script>
        const display = document.getElementById("location");

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                display.innerHTML = "Error: Current browser does not support geolocation.";
            }
        }

        function showPosition(position) {
            display.innerHTML = "Longitude: " + position.coords.longitude + "<br>" +
                                "Latitude: " + position.coords.latitude;
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    display.innerHTML = "Permission denied, Geolocation request blocked.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    display.innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    display.innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    display.innerHTML = "An unknown error occurred.";
                    break;
            }
        }

        getLocation();
    </script>
</body>
</html>
