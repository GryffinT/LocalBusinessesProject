<DOCTYPE! html>

<html lang="en" style="background-color: rgb(219, 219, 219); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <head>
        <meta charset="utf-8">
        <title>Local Business App</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body style="min-height:100vh; display: flex; justify-content: center; align-items: flex-start;">
        <div style="text-align:center; background-color:white; border-radius:5%; padding:1% 1% 1% 1%; height: 70%; width:30%;box-sizing:border-box;">
            <h1>Login</h1>
            <hr style="height:2px; width:60%;background-color:black;border: none;">
            <h3>Location Status: <span id="location"></span></h3>
            <form>
                <input id="password" type="password" value="password" name="password" style="border: 2px solid rgb(60,179,113);" required>
                <label for="password">Password</label><br>
                <br>
                <input id="username" value="username" name="username" style="border: 2px solid rgb(60,179,113);" required >
                <label for="username">Username</label><br>
                <button type="submit" style="margin-top:3%;">Login/Signup</button>
            </form>
        </div>
    <script>
        const display = document.getElementById("location");
    
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                display.innerHTML = "Error: Current browser does not support geolocation.";
            }
        }
    
        function showPosition(position) {
            display.innerHTML = "Longitude: " + position.coords.longitude + "<br>" +
                                "Latitude: " + position.coords.latitude;
        }
    
        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    display.innerHTML = "Permission denied, Geolocation request blocked.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    display.innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    display.innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    display.innerHTML = "An unknown error occurred.";
                    break;
            }
        }
    
        getLocation();
    </script>

        <div style="background-color: white;box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);display:grid;grid-template-columns: 1rem 1rem 1rem 1rem; position:fixed; margin-bottom: .5%; margin-top: 80%;border-radius: 5%;">
            <img src="https://i.postimg.cc/QtZVxCxw/icons8-search-in-list-50.png" class="dockedImage">
            <img src="https://i.postimg.cc/SxyxP31Z/icons8-home-page-50.png" class="dockedImage">
            <img src="https://i.postimg.cc/bNPyG4Pb/icons8-gear-50.png" class="dockedImage">
        </div>
    </body>
</html>
