<!DOCTYPE html>

<html lang="en" style="background-color: rgb(219, 219, 219); font-family:monospace; height: 100%; min-height: 100vh;">
    <head>
        <meta charset="utf-8">
        <title>Local Business App</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                min-height: 100vh;
                min-width: 100vw;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
            }
            .form-toggle {
                text-align: center;
                margin-top: 1rem;
            }
            .form-toggle a {
                cursor: pointer;
                text-decoration: none;
                color: #007bff;
            }
        </style>
    </head>
    <body>
        <div class="card-container">
            <h1 id="formTitle" style="margin:0 0 0.5rem 0;">Welcome Back</h1>
            <h2 id="formSubtitle" style="color: rgba(0, 0, 0, 0.6); margin:0 0 0.5rem 0; font-weight:normal; font-size:1rem;">
                Sign in to your account to continue.
            </h2>

            <form id="authForm" class="card-inset" novalidate style="margin-top: 10%; margin-bottom: 10%;">
                <div class="field">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="you@example.com" style="height:2rem; border-radius:5px;" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" required>
                </div>
                <div class="field" id="confirmPasswordField" style="display:none;">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" type="password" placeholder="Confirm your password">
                </div>
                <div class="actions">
                    <input id="agree" type="checkbox" required>
                    <label for="agree" class="agreement">
                        I agree to use this app responsibly and respectfully and will not hinder the operations or experiences of other users or businesses featured on this app.
                    </label>
                </div>
            </form>

            <hr class="card-divider" style="margin-bottom: 10%;">
            <button id="authBtn" class="confirm" style="width:100%; margin-top:0.5rem;">Sign In</button>

            <div class="form-toggle">
                <p id="toggleText" style="color: rgba(0, 0, 0, 0.5); font-size: 0.95rem;">
                    Don't have an account? <a id="toggleLink">Sign Up</a>
                </p>
            </div>
        </div>

        <h1 id="notif"></h1>

        <script type="module">
            import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

            const SUPABASE_URL = "https://jxqpsdgppqpuzlaylhmx.supabase.co";
            const SUPABASE_ANON_KEY = "sb_publishable_mHZz1EMda_IWSRHI4wBf9w_gtgrYC-T";

            const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const authBtn = document.getElementById("authBtn");
            const emailField = document.getElementById("email");
            const passwordField = document.getElementById("password");
            const confirmPasswordField = document.getElementById("confirmPassword");
            const agreeCheck = document.getElementById("agree");
            const notif = document.getElementById("notif");

            const formTitle = document.getElementById("formTitle");
            const formSubtitle = document.getElementById("formSubtitle");
            const confirmPasswordWrapper = document.getElementById("confirmPasswordField");

            const toggleLink = document.getElementById("toggleLink");
            const toggleText = document.getElementById("toggleText");

            let isSignUp = false;

            function showError(message) {
                notif.classList.remove("fade-out");
                void notif.offsetWidth;
                notif.classList.add("notification");
                notif.innerHTML = message;
                setTimeout(() => notif.classList.add("fade-out"), 2000);
            }

            toggleLink.addEventListener("click", () => {
                isSignUp = !isSignUp;
                if (isSignUp) {
                    formTitle.textContent = "Create Account";
                    formSubtitle.textContent = "Sign up to start using the app.";
                    confirmPasswordWrapper.style.display = "block";
                    authBtn.textContent = "Sign Up";
                    toggleText.innerHTML = 'Already have an account? <a id="toggleLink">Sign In</a>';
                } else {
                    formTitle.textContent = "Welcome Back";
                    formSubtitle.textContent = "Sign in to your account to continue.";
                    confirmPasswordWrapper.style.display = "none";
                    authBtn.textContent = "Sign In";
                    toggleText.innerHTML = 'Don\'t have an account? <a id="toggleLink">Sign Up</a>';
                }

                document.getElementById("toggleLink").addEventListener("click", () => toggleLink.click());
            });

            authBtn.addEventListener("click", async (e) => {
                e.preventDefault();

                const email = emailField.value.trim();
                const password = passwordField.value;
                const confirmPassword = confirmPasswordField.value;

                if (!agreeCheck.checked) return showError("You must agree to the terms to continue.");
                if (!email || !password) return showError("Email and password are required.");
                if (isSignUp && password !== confirmPassword) return showError("Passwords do not match.");

                try {
                    if (isSignUp) {
                        const { data, error } = await supabase.auth.signUp({ email, password });
                        if (error) return showError(error.message);
                        console.log("Signed up:", data.user.email);
                        showError("Sign-up successful! Please check your email to confirm.");
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) return showError(error.message);
                        console.log("Signed in:", data.user.email);
                        window.location.href = "location.html";
                    }
                } catch (err) {
                    console.error("Auth error:", err);
                    showError("Unexpected error. Check console.");
                }
            });

            (async () => {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    console.log("Session active, redirecting...");
                    window.location.href = "location.html";
                }
            })();
        </script>
    </body>
</html>
