<!DOCTYPE html>
<html lang="en" style="background-color: rgb(219, 219, 219); font-family:monospace; height: 100%; min-height: 100vh;">
<head>
    <meta charset="utf-8">
    <title>Local Business App</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            min-width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="card-container" style="align-items: flex-start; padding: 3%; height: 80%;">
    <h1 style="align-self: flex-start;margin:0;margin-bottom: 2%;">Welcome Back</h1>
    <h2 style="color: rgba(0, 0, 0, 0.5); width: 90%;align-self: flex-start; margin-top: 0;">Sign in to your account to continue.</h2>
    <form class="card-container"
        style="
            background-color: rgba(255, 255, 255, 0.53);
            font-family: monospace;
            width: 100%;
            height: 50%;
            padding: 1%;
            border-radius: 2.5%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.25);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        ">
        <label for="email" style="font-size: 1.2em; margin-bottom: 10px; color: rgb(0, 0, 0);margin-top: 5%; margin-left: 5%;">Email Address</label>
        <input type="text" 
            placeholder="you@example.com" 
            style="
                margin-left: 5%;
                width: 90%;
                height: 10%;
                padding: 10px;
                margin-bottom: 20px;
                font-size: 1.2em;
                border-radius: 5px;
                border: 1px solid rgba(0,0,0,0.3);
                box-sizing: border-box;
            " required>
        <label for="password" style="font-size: 1.2em; margin-bottom: 10px; color: rgba(0, 0, 0);margin-left: 5%;">Password</label>
        <input type="password" 
            placeholder="Enter your password"
            style="
                margin-left: 5%;
                width: 90%;
                height: 10%;
                padding: 10px;
                margin-bottom: 20px;
                font-size: 1.2em;
                border-radius: 5px;
                border: 1px solid rgba(0,0,0,0.3);
                box-sizing: border-box;
            " required>
            <br>
            <p style="width: 90%; align-self: center;font-size: .5rem;">I agree to use this app responsibly and respecfully. And will not hinder the operations or experiences of other users or businesses featured on this app.</p>
            <input type="checkbox" style="width: auto; height: auto; align-self: center; margin-bottom: 2%;align-self: flex-start; margin-left: 5%;" required>
    </form>
    <hr style="margin-top: 5%; background-color: rgba(0, 0, 0, 0.5); width: 100%;">
    <br>
    <button class="confirm" style="width: 100%;">
        Sign In
    </button>
    <p style="color: rgba(0, 0, 0, 0.5);font-size: 1.5rem;align-self: center;">Dont have an account? <a href="..." style="text-decoration: none;">Sign Up</a></p>
</div>
</body>
<button onclick="window.location='location.html'">Next</button>
</html>
