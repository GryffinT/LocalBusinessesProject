<!DOCTYPE html>

<html lang="en" style="background-color: rgb(219, 219, 219); font-family:monospace; height: 100%; min-height: 100vh;">
    <head>
        <meta charset="utf-8">
        <title>Location Status</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                min-height: 100vh;
                min-width: 100vw;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <div class="card-container" style="align-items: flex-start; padding: 3%; height: 80%;">
            <h1 style="align-self: flex-start;margin:0;margin-bottom: 2%;">Location confirmation</h1>
            <h2 style="color: rgba(0, 0, 0, 0.5); width: 90%;align-self: flex-start; margin-top: 0;">We need to verify your current location.</h2>
            <div class="card-container"
                style="background-color: rgba(255, 255, 255, 0.534);
                        font-family: monospace;
                        width: 100%;
                        padding: 20px;
                        height: 50%;
                        border-radius: 2.5%;
                        box-shadow: inset 0 0 10px rgba(0,0,0,0.25);
                        align-items: flex-start;
            ">
                <h3 style="margin: 0; color: rgba(0, 0, 0, 0.5);margin-top: 2%;">Coordinates</h3>
                <h1 style="font-weight: bold;"><span id="longitude"></span>, <span id="latitude"></span></h1>
                <br>
                <h3 style="margin-bottom: 0; color: rgba(0, 0, 0, 0.5);">Location</h3>
                <h1 style="margin-bottom: 0;"><span id="city">City</span>, <span id="state">State</span></h1>
                <h3 style="color: rgba(0, 0, 0, 0.5);" id="country">Country</h3>
                <h3 style="color: rgba(0, 0, 0, 0.5); margin-top: 7%;">Accuracy</h3>
                <h1 style="margin: 0;">20 meters</h1>
            </div>
            <hr style="margin-top: 5%; background-color: rgba(0, 0, 0, 0.5); width: 100%;">
            <h2 style="color: rgba(0, 0, 0, 0.5);">Is this information correct?</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 10px;">
                <button onclick="getLocation()" class="retry">
                    No, Retry
                </button>

                <button class="confirm">
                    Yes, Confirm
                </button>
            </div>
        </div>
        <script>
            const longitudeDisplay = document.getElementById("longitude");
            const latitudeDisplay = document.getElementById("latitude");
            const cityDisplay = document.getElementById("city");
            const stateDisplay = document.getElementById("state");
            const countryDisplay = document.getElementById("country");

            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showPosition, showError, {
                        enableHighAccuracy: true
                    });
                } else {
                    longitudeDisplay.innerHTML = "Browser does not support geolocation.";
                }
            }

            function showPosition(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                longitudeDisplay.innerHTML = lon;
                latitudeDisplay.innerHTML = lat;

                fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        const address = data.address || {};

                        cityDisplay.innerHTML = 
                            address.city || address.town || address.village || "Unknown";

                        stateDisplay.innerHTML =
                            address.state || address.region || "Unknown";
                        
                        countryDisplay.innerHTML = 
                            address.country || "Unknown";
                    })
                    .catch(error => {
                        console.error("Reverse geocoding error:", error);
                    });
            }

            function showError(error) {
                const msg = {
                    1: "Permission denied.",
                    2: "Position unavailable.",
                    3: "Request timed out."
                }[error.code] || "Unknown error.";

                console.error(msg);
            }

            getLocation();
        </script>

    </body>
</html>
