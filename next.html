<!DOCTYPE html>
<html lang="en" style="background-color: rgb(219, 219, 219); font-family:monospace; height: 100%; min-height: 100vh;overflow-y: hidden;">
<head>
    <meta charset="utf-8">
    <title>Next - Placeholder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body { height:100%; margin:0; padding:0; }
        body { display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>
    <div style="
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 2rem;
        padding: 5%;
        width: 100%;
        height: 80%;
        align-items: start;
    ">

        <div class="card-container" style="left: 0px;align-self: center;height: 100%; margin-left: 0px;">
            <div>
                <!-- <button class="confirm" onclick="showStored()">Show stored location</button> -->
                <button class="retry" onclick="window.location='index.html'" style="margin-left:8px;">Sign Out</button>
            </div>
            <hr style="height: .2%; background-color: rgb(0, 0, 0); width: 100%;margin-top: 5%;">
            <div class="card-inset" style="height: 8%;overflow: hidden; display: grid;grid-template-columns: auto 1fr;justify-content: center;align-items: center; padding: 2%;">
                <a id="shop" style="font-size: large; margin:0px"></a><pre id="specs" style="font-size:small; margin:0px"></pre>
            </div>
            <div class="card-inset" style="height: 80%; display: grid;grid-template-columns: auto; grid-template-rows: 70% 28%;">
                <h1>Hello</h1>
                <div class="card-container" style="height: 100%;width: 100%; padding: 5%;align-items: center; display: grid;grid-template-columns: 100%; grid-template-rows: auto auto;">
                    <button class="retry" style="width: 100%;">Leave a review.</button>
                    <button class="fav" style="width: 100%; margin-top: 10px;">Favorite</button>
                </div>
            </div>
        </div>
        <div class="card-container" style="width: 100%; height: 100%; padding: 3%;">
            <div class="card-inset" style="height: 5%; display: grid; grid-template-columns: 1fr 1fr 1fr auto; overflow-y: hidden;">
                <button onclick="fetchLocalBusinesses()" class="search">
                    Search
                </button>
                <select id="selection" class="cats">
                <option>All Categories</option>
                <!-- Food & Drink -->
                <option>Restaurant</option>
                <option>Cafe</option>
                <option>Bar</option>
                <option>Fast Food</option>
                <option>Pub</option>
                <!-- Shops -->
                <option>Supermarket</option>
                <option>Bakery</option>
                <option>Clothes Shop</option>
                <option>Electronics</option>
                <option>Bookstore</option>
                <option>Other Shops</option>
                <!-- Services -->
                <option>Bank / ATM</option>
                <option>Post Office</option>
                <option>Hairdresser</option>
                <option>Car Repair</option>
                <option>Gas Station</option>
                <option>Other Services</option>
                <!-- Health & Wellness -->
                <option>Pharmacy</option>
                <option>Hospital</option>
                <option>Clinic</option>
                <!-- Leisure & Tourism -->
                <option>Hotel</option>
                <option>Hostel</option>
                <option>Museum</option>
                <option>Park</option>
                <option>Gym</option>
                <!-- Favorites / Custom -->
                <option>Favorites</option>
                </select>

                <script>

                const lat = localStorage.getItem('user_latitude');
                const lon = localStorage.getItem('user_longitude');
                const apiKey = 'MMXckXut';

                async function fetchDealsForBusiness(name, lat, lon, apiKey) {
                    if (!name || !name.trim()) return ["NO_NAME"];
                    const url = `https://api.discountapi.com/v2/deals?api_key=${apiKey}&query=${encodeURIComponent(name)}&lat=${lat}&lon=${lon}&radius=6000`;
                    try {
                        const res = await fetch(url);
                        if (!res.ok) return [];
                        const data = await res.json();
                        return data.deals || [];
                    } catch (e) {
                        console.error("Deal fetch error for:", name, e);
                        return [];
                    }
                }

                async function fetchLocalBusinesses() {
                    const selection = document.getElementById("selection").value;

                    if (!lat || !lon) {
                        alert('Location not set. Please confirm your location first.');
                        return;
                    }

                    const categoryMap = {
                        "Restaurant": { key: "amenity", value: "restaurant" },
                        "Cafe": { key: "amenity", value: "cafe" },
                        "Bar": { key: "amenity", value: "bar" },
                        "Fast Food": { key: "amenity", value: "fast_food" },
                        "Pub": { key: "amenity", value: "pub" },
                        "Supermarket": { key: "shop", value: "supermarket" },
                        "Bakery": { key: "shop", value: "bakery" },
                        "Clothes Shop": { key: "shop", value: "clothes" },
                        "Electronics": { key: "shop", value: "electronics" },
                        "Bookstore": { key: "shop", value: "books" },
                        "Hotel": { key: "tourism", value: "hotel" },
                        "Hostel": { key: "tourism", value: "hostel" },
                        "Museum": { key: "tourism", value: "museum" },
                        "Park": { key: "leisure", value: "park" },
                        "Gym": { key: "leisure", value: "fitness_centre" }
                    };

                    const businessAmenities = ["restaurant","cafe","bar","fast_food","pub"];
                    const businessShops = ["supermarket","bakery","clothes","electronics","books"];
                    const businessTourism = ["hotel","hostel","museum"];
                    const businessLeisure = ["park","fitness_centre"];

                    let overpassQuery = '[out:json];(';

                    if (selection !== 'All Categories' && selection !== 'Favorites') {
                        const cat = categoryMap[selection];
                        if (cat) overpassQuery += `node["${cat.key}"="${cat.value}"](around:5000,${lat},${lon});`;
                    } else {
                        businessAmenities.forEach(a => overpassQuery += `node["amenity"="${a}"](around:5000,${lat},${lon});`);
                        businessShops.forEach(s => overpassQuery += `node["shop"="${s}"](around:5000,${lat},${lon});`);
                        businessTourism.forEach(t => overpassQuery += `node["tourism"="${t}"](around:5000,${lat},${lon});`);
                        businessLeisure.forEach(l => overpassQuery += `node["leisure"="${l}"](around:5000,${lat},${lon});`);
                    }

                    overpassQuery += ');out center;';

                    try {
                        const response = await fetch('https://overpass-api.de/api/interpreter', {
                            method: 'POST',
                            body: overpassQuery
                        });
                        const data = await response.json();

                        const resultsContainer = document.getElementById('resultsContainer');
                        resultsContainer.innerHTML = `<h2 style="margin-top:0;">Found ${data.elements.length} results:</h2>`;

                        if (data.elements.length === 0) {
                            resultsContainer.innerHTML += '<p>No businesses found nearby.</p>';
                            return;
                        }

                        data.elements.forEach(element => {
                            const name = element.tags?.name || 'Unnamed';
                            const type = element.tags?.amenity || element.tags?.shop || element.tags?.tourism || element.tags?.leisure || 'Unknown type';
                            const div = document.createElement('div');
                            const left = document.createElement('div');
                            const right = document.createElement('div');

                            let cuisineType = "N/A";

                            const itemTypePair = Object.entries(categoryMap).find(([key,value]) => {
                                return value.key in element.tags && element.tags[value.key] === value.value;
                            });

                            const itemTypeName = itemTypePair ? itemTypePair[0] : null;

                            if (["Restaurant", "Cafe", "Bar", "Fast Food", "Pub", "Bakery", "Supermarket"].includes(itemTypeName)) {
                                cuisineType = element.tags['cuisine'] || 'Various';
                            }

                            let cuisineTypes = cuisineType.split(';').map(c => c.trim()).filter(c => c.length > 0);
                            cuisineTypes = cuisineTypes.map(c => c.charAt(0).toUpperCase() + c.slice(1));
                            cuisineTypes = cuisineTypes.map(c => c.split('_').join(' '));
                            cuisineTypes = cuisineTypes.map(c => c.indexOf(' ') >= 0 ? c.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ') : c);
                            cuisineType = cuisineTypes.join(' • ');

                            let open = element.tags['opening_hours'] || 'N/A';
                            let accessibility = element.tags['wheelchair'] || 'N/A';
                            let website = element.tags['website'] || element.tags['contact:website'] || 'N/A';
                            let image = element.tags['image'] || '';
                            div.classList.add("resultItem");
                            div.style.cursor = "pointer";
                            left.classList.add("rleft");
                            right.classList.add("rright");
                            div.appendChild(left);
                            div.appendChild(right);

                            const text = document.createElement('h1');
                            text.classList.add("innerRight");
                            text.innerHTML = name;
                            text.style.marginBottom = "0px";
                            right.appendChild(text);

                            const businessType = document.createElement('h3');
                            businessType.classList.add("innerRight");
                            businessType.innerText = `${(cuisineType === "N/A" ? "" : cuisineType + " • ")}${itemTypeName}`;
                            businessType.style.color = "gray";
                            businessType.style.marginTop = "auto";
                            right.appendChild(businessType);

                            const location = document.createElement('div');
                            const marker = document.createElement('img');
                            marker.style.height = "15px";
                            marker.style.width = "15px";
                            const locText = document.createElement("h3");
                            marker.src = "https://i.postimg.cc/Rh97Nzsb/maps-and-flags.png";
                            location.classList.add("innerRightLocation");
                            locText.innerText = `${(element.tags['addr:housenumber'] === undefined ? " " : element.tags['addr:housenumber'] + ",")} ${(element.tags['addr:street'] === undefined ? " " : element.tags['addr:street'])}`;
                            locText.style.justifySelf = "start";
                            locText.style.color = "gray";
                            locText.style.fontWeight = "bold";
                            location.appendChild(marker);
                            location.appendChild(locText);
                            right.appendChild(location);

                            const saleIcon = document.createElement('img');
                            const salesContainer = document.createElement('div');
                            const salesLabeler = document.createElement('div');
                            const sale = document.createElement('div')
                            const deals = document.createElement('h3');
                            const salesTag = document.createElement('span');
                            saleIcon.src = "https://i.postimg.cc/YS55Y1mY/sale.png";
                            saleIcon.style.width = "15px";
                            saleIcon.style.height = "15px";
                            deals.innerText = "Deals";
                            deals.style.color = "gray";
                            salesLabeler.classList.add("salesLabel");
                            salesLabeler.appendChild(saleIcon);
                            salesLabeler.appendChild(deals);

                            sale.classList.add('sale');
                            sale.innerHTML = "Hello";
                            salesTag.classList.add("saleAmount")
                            salesTag.innerHTML = "50% OFF";
                            sale.appendChild(salesTag);
                            salesContainer.style.width = "100%";
                            salesContainer.appendChild(sale);

                            right.appendChild(salesLabeler);
                            right.appendChild(salesContainer);

                            let dealsData = fetchDealsForBusiness(name, lat, lon, apiKey);

                            if (dealsData.length > 0) {
                                const first = dealsData[0];
                                const dealTitle = first.deal.title || "Deal";
                                const dealText = first.deal.fine_print || "";
                                const merchantJson = first.deal.merchant || {}; // fallback to empty object
                                const locality = merchantJson.locality || "NONE";
                                let dealAmount = first.deal.discount_percentage ? first.deal.discount_percentage * 100 : 0;
                                dealAmount = Math.round(dealAmount * 10) / 10;
                                sale.innerHTML = `${dealTitle} - ${dealText} - ${locality}<span class="saleAmount">${dealAmount}% OFF</span>`;
                            } else {
                                sale.innerHTML = "No deals found.";
                            }

                            // store element data for full card
                            div.dataset.lat = element.lat;
                            div.dataset.lon = element.lon;
                            div.dataset.name = name;
                            div.dataset.type = itemTypeName || 'Other';
                            div.dataset.cuisine = ` ${cuisineType} | `;
                            div.dataset.hours = open;
                            div.dataset.accessibility = accessibility;
                            div.dataset.website = website;
                            div.dataset.image = image;

                            div.addEventListener('click', () => {
                                // populate #shop
                                const shopElem = document.getElementById('shop');
                                const specsElem = document.getElementById('specs');
                                if (shopElem) shopElem.textContent = div.dataset.name;
                                if (specsElem) specsElem.textContent = /* (div.dataset.cuisine !== " N/A | " ? div.dataset.cuisine : " ") + */ `| ${div.dataset.type}`;
                                if (shopElem) {
                                    if (div.dataset.website.includes("next.html") || div.dataset.website.includes("N/A")) {
                                        shopElem.removeAttribute("href");
                                    } else {
                                        shopElem.href = div.dataset.website;
                                    }
                                }

                                /* populate #image
                                const imageElem = document.getElementById('image');
                                if (imageElem) {
                                    if (div.dataset.image) {
                                        imageElem.src = div.dataset.image;
                                        imageElem.style.display = 'block';
                                    } else {
                                        imageElem.style.display = 'none';
                                    }
                                }
                                */

                                // highlight selected
                                document.querySelectorAll('.resultItem').forEach(item => item.style.backgroundColor = '');
                                div.style.backgroundColor = '#d0f0c0';
                            });

                            resultsContainer.appendChild(div);
                        });

                    } catch (err) {
                        console.error('Error fetching Overpass data:', err);
                        alert('Error fetching nearby businesses.');
                    }
                }

                document.querySelector("button[onclick='fetchLocalBusinesses()']").addEventListener('click', fetchLocalBusinesses);
                </script>




            </div>
            <div class="card-inset" style="margin-top: 1rem; height: 85%; overflow-y: auto;" id="resultsContainer">
                <h1 style="margin-top:0;" id="searchRes">Results will appear here.</h1>
            </div>
        </div>
    </div>
    <div class="docked-bar" style="padding: .5%; justify-content: center; align-items: center;">
        <img src="https://i.postimg.cc/zGk1qLgz/home.png" class="dockedImage" alt="Home">
        <img src="https://i.postimg.cc/LX8PxZzf/setting.png" class="dockedImage" alt="Settings">
        <img src="https://i.postimg.cc/htnBF8fS/global-search.png" class="dockedImage" alt="Search">
    </div>

    <script>
        function showStored(){
            const lat = localStorage.getItem('user_latitude') || 'not set';
            const lon = localStorage.getItem('user_longitude') || 'not set';
            const city = localStorage.getItem('user_city') || 'not set';
            const state = localStorage.getItem('user_state') || 'not set';
            const user = localStorage.getItem('sb_user') || 'not signed in';
            document.getElementById('stored').textContent = JSON.stringify({ lat, lon, city, state, user }, null, 2);
        }
    </script>
</body>
</html>
